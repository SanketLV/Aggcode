<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Workspaces" style="width: 288px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #131419; border-right: 1px solid rgba(255,255,255,0.07); font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #f1f2f5;">

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.07);">
<div aria-hidden="true" style="width: 26px; height: 26px; border-radius: 6px; background: #1e1f26; border: 1px solid rgba(255,255,255,0.13); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 500; color: #74c0e0;">&gt;_</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em;">Aggcode</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #83868f;"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #52cc98;"></span>Connected</span>
</div>
<button type="button" aria-label="Add workspace" style="width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #9fa2ad; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</div>

<div style="padding: 16px 14px 6px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 500; color: #83868f;">
<span>Workspaces</span>
<span style="font-variant-numeric: tabular-nums;">3</span>
</div>

<div style="flex-grow: 1; min-height: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px;">

<button type="button" aria-expanded="true" style="width: 100%; padding: 6px 8px; display: flex; align-items: flex-start; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #f1f2f5; font-family: inherit; text-align: left; cursor: pointer;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#83868f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 13px; font-weight: 500;">aggcode</span>
<span style="font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 11px; color: #9fa2ad;">D:\Projects\aggcode</span>
</span>
</button>

<div style="margin: 0 0 6px 15px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.09); display: flex; flex-direction: column; gap: 1px;">
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
<sc-if value="{{s.isActive}}" hint-placeholder-val="{{false}}">
<button type="button" aria-current="true" style="position: relative; width: 100%; height: 32px; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: #24252d; color: #f1f2f5; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;">
<span aria-hidden="true" style="position: absolute; left: -9px; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: #74c0e0;"></span>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{s.title}}</span>
<span style="font-size: 11px; color: #9fa2ad; font-variant-numeric: tabular-nums;">{{s.when}}</span>
</button>
</sc-if>
<sc-if value="{{s.isIdle}}" hint-placeholder-val="{{true}}">
<button type="button" style="width: 100%; height: 32px; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #9fa2ad; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;">
<span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{s.title}}</span>
<span style="font-size: 11px; color: #83868f; font-variant-numeric: tabular-nums;">{{s.when}}</span>
</button>
</sc-if>
</sc-for>
<button type="button" style="width: 100%; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 6px; background: transparent; color: #83868f; font-family: inherit; font-size: 12px; text-align: left; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>New session</button>
</div>

<button type="button" aria-expanded="false" style="width: 100%; padding: 6px 8px; display: flex; align-items: flex-start; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #f1f2f5; font-family: inherit; text-align: left; cursor: pointer;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#83868f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 13px; font-weight: 500;">billing-api</span>
<span style="font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 11px; color: #9fa2ad;">D:\Work\billing-api</span>
</span>
</button>

<button type="button" aria-expanded="false" style="width: 100%; padding: 6px 8px; display: flex; align-items: flex-start; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #f1f2f5; font-family: inherit; text-align: left; cursor: pointer;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#83868f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 13px; font-weight: 500;">notes-site</span>
<span style="font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 11px; color: #9fa2ad;">D:\Projects\notes-site</span>
</span>
</button>

</div>

<div style="flex-shrink: 0; padding: 10px 8px 12px; border-top: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 2px;">
<span style="padding: 0 8px 4px; font-size: 11px; font-weight: 500; color: #83868f;">Providers</span>
<button type="button" style="width: 100%; height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #f1f2f5; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #52cc98;"></span>
<span style="flex-grow: 1;">Claude</span>
<span style="font-size: 11px; color: #9fa2ad;">Signed in</span>
</button>
<button type="button" style="width: 100%; height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: #f1f2f5; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #e8c35a;"></span>
<span style="flex-grow: 1;">OpenCode</span>
<span style="font-size: 11px; color: #e8c35a;">Sign in</span>
</button>
</div>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["reconnect","icons","init","new"],"default":"reconnect"},"$preview":{"width":288,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var active = this.props.active ?? 'reconnect';
var base = [
{ id: 'reconnect', title: 'Fix reconnect in useSocket', when: '4m' },
{ id: 'icons', title: 'Tool icons for Bash and Grep', when: '2h' },
{ id: 'init', title: 'Why does init drop parts?', when: 'Mon' }
];
if (active === 'new') {
base = [{ id: 'new', title: 'New session', when: 'now' }].concat(base);
}
return {
sessions: base.map(function (s) {
return { title: s.title, when: s.when, isActive: s.id === active, isIdle: s.id !== active };
})
};
}
}
</script>
</body>
</html>
